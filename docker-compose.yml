name: cinegraph

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: cinegraph-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-2G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-2G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1G}
      # Hard ceiling for any single query, so a runaway query (e.g. from the LLM) cannot hang the database.
      NEO4J_db_transaction_timeout: 30s
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt (driver protocol)
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build: .
    image: ${API_IMAGE:-cinegraph-api:dev}
    container_name: cinegraph-api
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      DATA_DIR: /data/raw
    volumes:
      - ./data:/data:ro
      - ./models:/app/models
    depends_on:
      neo4j:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: cinegraph-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional: run the LLM inside Docker instead of the host's Ollama app.
  # Start with `docker compose --profile ollama up`. Slower on macOS (no GPU inside Docker).
  ollama:
    image: ollama/ollama:0.6.8
    container_name: cinegraph-ollama
    profiles: ["ollama"]
    ports:
      - "11435:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  neo4j_data:
  neo4j_plugins:
  ollama_models:

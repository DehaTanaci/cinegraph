name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${{ secrets.CI_NEO4J_PASSWORD }}
      DATA_DIR: ./data/raw
      DATASET: ml-latest-small
      ADMIN_API_KEY: ${{ secrets.CI_ADMIN_API_KEY }}
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/${{ secrets.CI_NEO4J_PASSWORD }}
          NEO4J_PLUGINS: '["graph-data-science"]'
          NEO4J_dbms_security_procedures_unrestricted: gds.*
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Cache MovieLens small
        id: movielens
        uses: actions/cache@v4
        with:
          path: data/raw/ml-latest-small
          key: movielens-ml-latest-small-v1
      - name: Download MovieLens small
        if: steps.movielens.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/raw && cd data/raw
          if curl -fsSLO --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 \
               https://files.grouplens.org/datasets/movielens/ml-latest-small.zip; then
            unzip -q ml-latest-small.zip && rm ml-latest-small.zip
          else
            echo "::warning::GroupLens unreachable: Neo4j integration tests will be skipped in this run"
          fi
      - name: Seed graph and run algorithms
        if: hashFiles('data/raw/ml-latest-small/movies.csv') != ''
        run: |
          python -m scripts.seed_data
          python -c "from app.database.neo4j_client import get_client; from app.services.gds_service import GdsService; GdsService(get_client()).run_all()"
      - name: "Tests with coverage (container tests skip: no Compose stack in CI)"
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

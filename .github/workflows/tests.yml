name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-password-only
      DATA_DIR: ./data/raw
      DATASET: ml-latest-small
      ADMIN_API_KEY: ci-admin-key
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-password-only
          NEO4J_PLUGINS: '["graph-data-science"]'
          NEO4J_dbms_security_procedures_unrestricted: gds.*
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Download MovieLens small
        run: |
          mkdir -p data/raw && cd data/raw
          curl -fsSLO https://files.grouplens.org/datasets/movielens/ml-latest-small.zip
          unzip -q ml-latest-small.zip
      - name: Seed graph and run algorithms
        run: |
          python -m scripts.seed_data
          python -c "from app.database.neo4j_client import get_client; from app.services.gds_service import GdsService; GdsService(get_client()).run_all()"
      - name: "Tests with coverage (container tests skip: no Compose stack in CI)"
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

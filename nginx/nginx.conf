events {}

http {
    # Basic abuse protection: at most 10 requests/second per client IP, bursts of 20.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # The LLM endpoint is expensive: 1 request/second per client.
    limit_req_zone $binary_remote_addr zone=ask_limit:10m rate=1r/s;

    upstream api {
        server api:8000;
    }

    server {
        listen 80;
        client_max_body_size 1m;

        location /api/ask {
            limit_req zone=ask_limit burst=5 nodelay;
            proxy_read_timeout 180s;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
